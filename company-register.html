<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تسجيل شركة تأمين - Assurix</title>
  
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#004aad">

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f2f2f2;
      padding: 20px;
      margin: 0;
    }

    .container {
      background: white;
      padding: 30px;
      border-radius: 15px;
      max-width: 500px;
      margin: auto;
      box-shadow: 0 0 15px rgba(0,0,0,0.1);
    }

    h2 {
      color: #004aad;
      text-align: center;
      margin-bottom: 10px;
    }

    p.subtitle {
      text-align: center;
      color: #666;
      font-size: 14px;
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-top: 15px;
      font-weight: bold;
      font-size: 14px;
      color: #333;
    }

    input, button {
      width: 100%;
      padding: 12px;
      margin-top: 8px;
      border-radius: 8px;
      border: 1px solid #ccc;
      box-sizing: border-box;
      font-size: 16px;
    }

    input[type="file"] {
      border: 1px dashed #004aad;
      background: #f9f9f9;
      padding: 10px;
    }

    button {
      background: #004aad;
      color: white;
      border: none;
      cursor: pointer;
      font-weight: bold;
      margin-top: 25px;
      transition: 0.3s;
    }

    button:hover {
      background: #00337a;
    }

    .back-link {
      display: block;
      text-align: center;
      margin-top: 15px;
      color: #666;
      text-decoration: none;
      font-size: 14px;
    }
  </style>
</head>

<body>

<div class="container">
  <h2>تسجيل شركة تأمين</h2>
  <p class="subtitle">يرجى إدخال بيانات الشركة لتقديم طلب الانضمام</p>

  <input type="text" id="companyName" placeholder="اسم الشركة">
  <input type="email" id="email" placeholder="البريد الإلكتروني">
  <input type="text" id="phone" placeholder="رقم الهاتف">
  <input type="text" id="license" placeholder="رقم الاعتماد">
  <input type="text" id="nrc" placeholder="رقم السجل التجاري NRC">
  <input type="text" id="nif" placeholder="رقم التعريف الجبائي NIF">

  <label>وثيقة الاعتماد (صورة أو PDF)</label>
  <input type="file" id="licenseFile">

  <label>وثيقة NRC</label>
  <input type="file" id="nrcFile">

  <label>وثيقة NIF</label>
  <input type="file" id="nifFile">

  <button onclick="registerCompany()">إرسال طلب التسجيل</button>
  
  <a href="./home.html" class="back-link">العودة للرئيسية</a>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  // إعدادات Firebase الخاصة بمشروعك Assurix
  const firebaseConfig = {
    apiKey: "AIzaSyAQsQ9BU6gcps6XSVgKGKLn7pq_VKeX9Tk",
    authDomain: "assurix-17f53.firebaseapp.com",
    projectId: "assurix-17f53",
    storageBucket: "assurix-17f53.firebasestorage.app",
    messagingSenderId: "793139269214",
    appId: "1:793139269214:web:c0bc20bd1c14a98cb86ecf"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  window.registerCompany = async function() {
    const btn = document.querySelector("button");
    
    // سحب القيم من الحقول
    const companyName = document.getElementById("companyName").value;
    const email = document.getElementById("email").value;

    if (!companyName || !email) {
      alert("يرجى إدخال اسم الشركة والبريد الإلكتروني");
      return;
    }

    btn.disabled = true;
    btn.innerText = "جاري إرسال الطلب...";

    try {
      // إضافة الطلب إلى مجموعة insurance_companies في Firestore
      await addDoc(collection(db, "insurance_companies"), {
        companyName: companyName,
        email: email,
        phone: document.getElementById("phone").value,
        license: document.getElementById("license").value,
        nrc: document.getElementById("nrc").value,
        nif: document.getElementById("nif").value,
        // حفظ أسماء الملفات فقط (يتطلب Firebase Storage لرفع الملفات الفعلية)
        licenseFile: document.getElementById("licenseFile").files[0]?.name || "لم يتم الرفع",
        nrcFile: document.getElementById("nrcFile").files[0]?.name || "لم يتم الرفع",
        nifFile: document.getElementById("nifFile").files[0]?.name || "لم يتم الرفع",
        status: "pending", // حالة الطلب تكون "قيد المراجعة" افتراضياً
        createdAt: new Date()
      });

      alert("تم إرسال طلب الانضمام بنجاح 🎉 سنقوم بمراجعة بياناتكم قريباً.");
      window.location.href = "./home.html";
      
    } catch (error) {
      console.error("خطأ في Firestore:", error);
      alert("حدث خطأ أثناء الإرسال. يرجى التحقق من اتصال الإنترنت.");
      btn.disabled = false;
      btn.innerText = "إرسال طلب التسجيل";
    }
  }
</script>

<script>
  // تفعيل الـ Service Worker لضمان استجابة التطبيق
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('./sw.js');
  }
</script>

</body>
</html>
