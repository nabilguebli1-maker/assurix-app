<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تسجيل شركة تأمين - Assurix</title>
  
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#004aad">

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f2f2f2;
      padding: 20px;
      margin: 0;
    }

    .container {
      background: white;
      padding: 30px;
      border-radius: 15px;
      max-width: 500px;
      margin: auto;
      box-shadow: 0 0 15px rgba(0,0,0,0.1);
    }

    h2 {
      color: #004aad;
      text-align: center;
      margin-bottom: 10px;
    }

    p.subtitle {
      text-align: center;
      color: #666;
      font-size: 14px;
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-top: 15px;
      font-weight: bold;
      font-size: 14px;
      color: #333;
    }

    input, button {
      width: 100%;
      padding: 12px;
      margin-top: 8px;
      border-radius: 8px;
      border: 1px solid #ccc;
      box-sizing: border-box;
      font-size: 16px;
    }

    input[type="file"] {
      border: 1px dashed #004aad;
      background: #f9f9f9;
      padding: 10px;
    }

    button {
      background: #004aad;
      color: white;
      border: none;
      cursor: pointer;
      font-weight: bold;
      margin-top: 25px;
      transition: 0.3s;
    }

    button:hover {
      background: #00337a;
    }

    button:disabled {
      background: #aaa;
      cursor: not-allowed;
    }

    .back-link {
      display: block;
      text-align: center;
      margin-top: 15px;
      color: #666;
      text-decoration: none;
      font-size: 14px;
    }
  </style>
</head>

<body>

<div class="container">
  <h2>تسجيل شركة تأمين</h2>
  <p class="subtitle">يرجى إدخال بيانات الشركة لتقديم طلب الانضمام</p>

  <input type="text" id="companyName" placeholder="اسم الشركة">
  <input type="email" id="email" placeholder="البريد الإلكتروني">
  <input type="text" id="phone" placeholder="رقم الهاتف">
  <input type="text" id="address" placeholder="عنوان مقر الشركة">
  <input type="text" id="license" placeholder="رقم الاعتماد">
  <input type="text" id="nrc" placeholder="رقم السجل التجاري NRC">
  <input type="text" id="nif" placeholder="رقم التعريف الجبائي NIF">

  <label>وثيقة الاعتماد (صورة أو PDF)</label>
  <input type="file" id="licenseFile">

  <label>وثيقة NRC</label>
  <input type="file" id="nrcFile">

  <label>وثيقة NIF</label>
  <input type="file" id="nifFile">

  <button id="submitBtn">إرسال طلب التسجيل</button>
  
  <a href="./home.html" class="back-link">العودة للرئيسية</a>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  // تم استعادة بيانات Firebase الحقيقية والمطابقة لمشروعك الأصلي هنا
  const firebaseConfig = {
    apiKey: "AIzaSyAQsQ9BU6gcps6XSVgKGKLn7pq_VKeX9Tk",
    authDomain: "assurix-17f53.firebaseapp.com",
    projectId: "assurix-17f53",
    storageBucket: "assurix-17f53.firebasestorage.app",
    messagingSenderId: "793139269214",
    appId: "1:793139269214:web:c0bc20bd1c14a98cb86ecf"
  };

  const app = initializeApp(firebaseConfig);
  const db = getFirestore(app);

  // إعدادات Cloudinary الخاصة بك
  const cloudName = "dzge7uzkq";
  const uploadPreset = "unsigned_upload"; 

  async function uploadFile(file) {
    if (!file) return "لم يتم الرفع"; // معالجة حالة عدم اختيار ملف لتفادي توقف الكود
    
    const formData = new FormData();
    formData.append("file", file);
    formData.append("upload_preset", uploadPreset);

    const res = await fetch(`https://api.cloudinary.com/v1_1/${cloudName}/upload`, {
      method: "POST",
      body: formData
    });

    if (!res.ok) {
      throw new Error("فشل رفع أحد الملفات إلى Cloudinary");
    }

    const data = await res.json();
    return data.secure_url;
  }

  // ربط حدث الضغط على زر الإرسال
  document.getElementById("submitBtn").addEventListener("click", async () => {
    const btn = document.getElementById("submitBtn");
    
    const companyName = document.getElementById("companyName").value.trim();
    const email = document.getElementById("email").value.trim();
    const phone = document.getElementById("phone").value.trim();
    const address = document.getElementById("address").value.trim();
    const license = document.getElementById("license").value.trim();
    const nrc = document.getElementById("nrc").value.trim();
    const nif = document.getElementById("nif").value.trim();

    const licenseFile = document.getElementById("licenseFile").files[0];
    const nrcFile = document.getElementById("nrcFile").files[0];
    const nifFile = document.getElementById("nifFile").files[0];

    // التحقق الأساسي من الحقول النصية المفتاحية
    if (!companyName || !email || !phone || !address || !license || !nrc || !nif) {
      alert("يرجى ملء جميع الحقول النصية المطلوبة وعنوان الشركة");
      return;
    }

    btn.disabled = true;
    btn.innerText = "جاري رفع الملفات وإرسال الطلب...";

    try {
      // رفع الملفات والحصول على الروابط المباشرة من Cloudinary
      const licenseFileUrl = await uploadFile(licenseFile);
      const nrcFileUrl = await uploadFile(nrcFile);
      const nifFileUrl = await uploadFile(nifFile);

      // حفظ البيانات الموسعة بالكامل في قاعدة بيانات Firestore
      await addDoc(collection(db, "insurance_companies"), {
        companyName,
        email,
        phone,
        address,
        license,
        nrc,
        nif,
        licenseFileUrl,
        nrcFileUrl,
        nifFileUrl,
        status: "pending",
        createdAt: new Date().toISOString()
      });

      alert("تم إرسال طلب التسجيل بنجاح 🎉");
      window.location.href = "./home.html";

    } catch (error) {
      console.error(error);
      alert("حدث خطأ أثناء الإرسال: " + error.message);
      btn.disabled = false;
      btn.innerText = "إرسال طلب التسجيل";
    }
  });
</script>

<script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('./sw.js');
  }
</script>

</body>
</html>
