<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تسجيل شركة تأمين - Assurix</title>
<style>
body{
font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
background:#f2f2f2;
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
margin:0;
padding: 20px 0;
box-sizing: border-box;
}
.box{
background:white;
padding:30px;
border-radius:10px;
width:90%;
max-width:400px;
box-shadow: 0 4px 15px rgba(0,0,0,0.1);
}
h2 {
color: #004aad;
text-align: center;
margin-bottom: 20px;
}
input, button {
width:100%;
padding:12px;
margin-top:12px;
border-radius: 6px;
border: 1px solid #ccc;
box-sizing: border-box;
font-size: 15px;
}
input:focus {
border-color: #004aad;
outline: none;
}
button{
background:#004aad;
color:white;
border:none;
cursor:pointer;
font-weight: bold;
font-size: 16px;
margin-top: 20px;
transition: background 0.3s ease;
}
button:hover {
background: #003580;
}
</style>
</head>
<body>

<div class="box">
<h2>تسجيل شركة تأمين جديدة</h2>
<input type="text" id="companyName" placeholder="اسم الشركة">
<input type="email" id="email" placeholder="البريد الإلكتروني">
<input type="password" id="password" placeholder="كلمة المرور">
<button onclick="registerCompany()">تسجيل الحساب</button>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, doc, setDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

// الإعدادات الحقيقية الخاصة بمشروعك
const firebaseConfig = {
  apiKey: "AIzaSyAQsQ9BU6gcps6XSVgKGKLn7pq_VKeX9Tk",
  authDomain: "assurix-17f53.firebaseapp.com",
  projectId: "assurix-17f53",
  storageBucket: "assurix-17f53.firebasestorage.app",
  messagingSenderId: "532252538173",
  appId: "1:532252538173:web:96e2be6dfdf2d9ca7ba36e"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

window.registerCompany = async function() {
  const companyName = document.getElementById("companyName").value.trim();
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;

  if(!companyName || !email || !password) {
    alert("يرجى ملء جميع الحقول");
    return;
  }

  try {
    // 1. إنشاء الحساب في الـ Authentication
    const userCredential = await createUserWithEmailAndPassword(auth, email, password);
    const user = userCredential.user;

    // 2. حفظ بيانات الشركة الإضافية في الـ Firestore Database
    await setDoc(doc(db, "insurance_companies", user.uid), {
      companyName: companyName,
      email: email,
      createdAt: new Date().toISOString()
    });

    alert("تم تسجيل الشركة بنجاح!");
    window.location.href = "./dashboard.html";

  } catch(error) {
    console.error(error);
    alert("حدث خطأ أثناء التسجيل: " + error.message);
  }
}
</script>

</body>
</html>
