<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>تسجيل شركة تأمين - Assurix</title>
<style>
body{
font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
background:#f2f2f2;
display:flex;
justify-content:center;
align-items:center;
min-height:100vh;
margin:0;
padding: 20px 0;
box-sizing: border-box;
}
.box{
background:white;
padding:30px;
border-radius:10px;
width:90%;
max-width:400px;
box-shadow: 0 4px 15px rgba(0,0,0,0.1);
}
h2 {
color: #004aad;
text-align: center;
margin-bottom: 10px;
}
p.subtitle {
text-align: center;
color: #666;
font-size: 14px;
margin-bottom: 20px;
}
input, button {
width:100%;
padding:12px;
margin-top:12px;
border-radius: 6px;
border: 1px solid #ccc;
box-sizing: border-box;
font-size: 15px;
}
input:focus {
border-color: #004aad;
outline: none;
}
button{
background:#004aad;
color:white;
border:none;
cursor:pointer;
font-weight: bold;
font-size: 16px;
margin-top: 20px;
transition: background 0.3s ease;
}
button:hover {
background: #003580;
}
</style>
</head>
<body>

<div class="box">
<h2>تسجيل شركة تأمين جديدة</h2>
<p class="subtitle">يرجى ملء البيانات لطلب الانضمام إلى المنصة</p>

<input type="text" id="companyName" placeholder="اسم الشركة">
<input type="email" id="email" placeholder="البريد الإلكتروني">
<input type="password" id="password" placeholder="كلمة المرور">
<input type="tel" id="phone" placeholder="رقم الهاتف">
<input type="text" id="license" placeholder="رقم رخصة النشاط">
<input type="text" id="nrc" placeholder="رقم السجل التجاري (NRC)">
<input type="text" id="nif" placeholder="الرقم التعريف الجبائي (NIF)">

<button onclick="registerCompany()">إرسال طلب التسجيل</button>
</div>

<script type="module">
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

// إعدادات Firebase الحقيقية الخاصة بك
const firebaseConfig = {
  apiKey: "AIzaSyAQsQ9BU6gcps6XSVgKGKLn7pq_VKeX9Tk",
  authDomain: "assurix-17f53.firebaseapp.com",
  projectId: "assurix-17f53",
  storageBucket: "assurix-17f53.firebasestorage.app",
  messagingSenderId: "532252538173",
  appId: "1:532252538173:web:96e2be6dfdf2d9ca7ba36e"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

window.registerCompany = async function() {
  const companyName = document.getElementById("companyName").value.trim();
  const email = document.getElementById("email").value.trim();
  const password = document.getElementById("password").value;
  const phone = document.getElementById("phone").value.trim();
  const license = document.getElementById("license").value.trim();
  const nrc = document.getElementById("nrc").value.trim();
  const nif = document.getElementById("nif").value.trim();

  // التحقق من ملء كافة الحقول المضافة حديثاً
  if(!companyName || !email || !password || !phone || !license || !nrc || !nif) {
    alert("يرجى ملء جميع الحقول المطلوبة");
    return;
  }

  try {
    // 1. إنشاء حساب المصادقة للمستخدم
    await createUserWithEmailAndPassword(auth, email, password);

    // 2. حفظ البيانات الموسعة بالكامل في Firestore مع الحالة "pending"
    await addDoc(collection(db, "insurance_companies"), {
      companyName,
      email,
      phone,
      license,
      nrc,
      nif,
      status: "pending",
      createdAt: new Date().toISOString()
    });

    alert("تم إرسال طلبك بنجاح! حسابك الآن قيد المراجعة والتدقيق.");
    
    // التوجيه إلى صفحة الانتظار أو الرئيسية بدلاً من الدخول الفوري للوحة التحكم
    window.location.href = "./home.html";

  } catch(error) {
    console.error(error);
    alert("حدث خطأ أثناء إرسال البيانات: " + error.message);
  }
}
</script>

</body>
</html>
