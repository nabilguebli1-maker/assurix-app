<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>تسجيل شركة تأمين - Assurix</title>
  
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#004aad">

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f2f2f2;
      padding: 20px;
      margin: 0;
    }

    .container {
      background: white;
      padding: 30px;
      border-radius: 15px;
      max-width: 500px;
      margin: auto;
      box-shadow: 0 0 15px rgba(0,0,0,0.1);
    }

    h2 {
      color: #004aad;
      text-align: center;
      margin-bottom: 10px;
    }

    p.subtitle {
      text-align: center;
      color: #666;
      font-size: 14px;
      margin-bottom: 20px;
    }

    label {
      display: block;
      margin-top: 15px;
      font-weight: bold;
      font-size: 14px;
      color: #333;
    }

    input, button {
      width: 100%;
      padding: 12px;
      margin-top: 8px;
      border-radius: 8px;
      border: 1px solid #ccc;
      box-sizing: border-box;
      font-size: 16px;
    }

    input:focus {
      border-color: #004aad;
      outline: none;
    }

    input[type="file"] {
      border: 1px dashed #004aad;
      background: #f9f9f9;
      padding: 10px;
    }

    button {
      background: #004aad;
      color: white;
      border: none;
      cursor: pointer;
      font-weight: bold;
      margin-top: 25px;
      transition: 0.3s;
    }

    button:hover {
      background: #00337a;
    }

    button:disabled {
      background: #aaa;
      cursor: not-allowed;
    }

    .back-link {
      display: block;
      text-align: center;
      margin-top: 15px;
      color: #666;
      text-decoration: none;
      font-size: 14px;
    }
  </style>
</head>

<body>

<div class="container">
  <h2>تسجيل شركة تأمين</h2>
  <p class="subtitle">يرجى إدخال بيانات الشركة لتقديم طلب الانضمام</p>

  <input type="text" id="companyName" placeholder="اسم الشركة">
  <input type="email" id="email" placeholder="البريد الإلكتروني">
  <input type="password" id="password" placeholder="Password">
  <input type="text" id="phone" placeholder="رقم الهاتف">
  <input type="text" id="address" placeholder="عنوان مقر الشركة">
  <input type="text" id="license" placeholder="رقم الاعتماد">
  <input type="text" id="nrc" placeholder="رقم السجل التجاري NRC">
  <input type="text" id="nif" placeholder="رقم التعريف الجبائي NIF">

  <label>وثيقة الاعتماد (صورة أو PDF)</label>
  <input type="file" id="licenseFile">

  <label>وثيقة NRC</label>
  <input type="file" id="nrcFile">

  <label>وثيقة NIF</label>
  <input type="file" id="nifFile">

  <button id="submitBtn">إرسال طلب التسجيل</button>
  
  <a href="./index.html" class="back-link">العودة للرئيسية</a>
</div>

<script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getAuth, createUserWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
  import { getFirestore, collection, addDoc } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

  // إعدادات Firebase الحقيقية والمطابقة لمشروعك الأصلي (Assurix)
  const firebaseConfig = {
    apiKey: "AIzaSyAQsQ9BU6gcps6XSVgKGKLn7pq_VKeX9Tk",
    authDomain: "assurix-17f53.firebaseapp.com",
    projectId: "assurix-17f53",
    storageBucket: "assurix-17f53.firebasestorage.app",
    messagingSenderId: "793139269214",
    appId: "1:793139269214:web:c0bc20bd1c14a98cb86ecf"
  };

  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);
  const db = getFirestore(app);

  // إعدادات Cloudinary لرفع المستندات مجاناً والالتفاف على قيود حظر سعة Firebase المجانية
  const cloudName = "dzge7uzkq";
  const uploadPreset = "unsigned_upload"; 

  async function uploadFile(file) {
    if (!file) return ""; // إذا لم يتم اختيار ملف، نخزن رابطاً فارغاً
    
    const formData = new FormData();
    formData.append("file", file);
    formData.append("upload_preset", uploadPreset);

    const res = await fetch(`https://api.cloudinary.com/v1_1/${cloudName}/upload`, {
      method: "POST",
      body: formData
    });

    if (!res.ok) {
      throw new Error("حدث خطأ أثناء رفع أحد المستندات إلى سيرفر التخزين.");
    }

    const data = await res.json();
    return data.secure_url; // إرجاع الرابط المباشر للمستند المرفوع
  }

  document.getElementById("submitBtn").addEventListener("click", async () => {
    const btn = document.getElementById("submitBtn");

    const email = document.getElementById("email").value.trim();
    const password = document.getElementById("password").value;
    const companyName = document.getElementById("companyName").value.trim();
    const phone = document.getElementById("phone").value.trim();
    const address = document.getElementById("address").value.trim();
    const license = document.getElementById("license").value.trim();
    const nrc = document.getElementById("nrc").value.trim();
    const nif = document.getElementById("nif").value.trim();

    const licenseFile = document.getElementById("licenseFile").files[0];
    const nrcFile = document.getElementById("nrcFile").files[0];
    const nifFile = document.getElementById("nifFile").files[0];

    if (!email || !password || !companyName || !phone || !address || !license || !nrc || !nif) {
      alert("يرجى ملء جميع الحقول المطلوبة ورفع المستندات المتاحة");
      return;
    }

    btn.disabled = true;
    btn.innerText = "جاري معالجة المستندات وإنشاء الحساب...";

    try {
      // 1. إنشاء حساب المصادقة (Auth)
      const userCredential = await createUserWithEmailAndPassword(auth, email, password);
      const user = userCredential.user;

      // 2. رفع الملفات إلى Cloudinary مجاناً دون استخدام Firebase Storage
      const licenseFileUrl = await uploadFile(licenseFile);
      const nrcFileUrl = await uploadFile(nrcFile);
      const nifFileUrl = await uploadFile(nifFile);

      // 3. حفظ البيانات المترابطة بالكامل في Cloud Firestore
      await addDoc(collection(db, "insurance_companies"), {
        uid: user.uid,
        companyName,
        email,
        phone,
        address,
        license,
        nrc,
        nif,
        licenseFileUrl,
        nrcFileUrl,
        nifFileUrl,
        status: "pending",
        createdAt: new Date().toISOString()
      });

      alert("تم تسجيل الشركة بنجاح - طلبكم في انتظار موافقة الإدارة 🎉");
      window.location.href = "./index.html";

    } catch (error) {
      console.error(error);
      alert("فشل التسجيل: " + error.message);
      btn.disabled = false;
      btn.innerText = "إرسال طلب التسجيل";
    }
  });
</script>

<script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('./sw.js');
  }
</script>

</body>
</html>
