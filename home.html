<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Assurix - الرئيسية</title>

  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#004aad">

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f2f2f2;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    .container {
      text-align: center;
      background: white;
      padding: 30px;
      border-radius: 15px;
      width: 90%;
      max-width: 350px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
    }

    h1 {
      color: #004aad;
      margin-bottom: 10px;
    }

    p {
      color: #666;
      margin-bottom: 25px;
      font-size: 14px;
    }

    button {
      width: 100%;
      padding: 15px;
      margin-top: 12px;
      border: none;
      border-radius: 10px;
      background: #004aad;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
      transition: transform 0.2s, opacity 0.2s;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    button:hover {
      opacity: 0.9;
      transform: translateY(-2px);
    }

    /* زر التسجيل بلون مختلف لتمييزه */
    .btn-register {
      background: #28a745; /* لون أخضر للتمييز */
    }

    .icon {
      font-size: 20px;
      margin-left: 10px;
    }
  </style>
</head>

<body>

<div class="container">
  <h1>Assurix</h1>
  <p>منصة التأمين الذكية</p>

  <button onclick="window.location.href='./index.html'">
    <span class="icon">👤</span> طالب تأمين
  </button>

  <button onclick="window.location.href='./login.html'">
    <span class="icon">🧑‍💼</span> دخول شركات التأمين
  </button>

  <button class="btn-register" onclick="window.location.href='./company-register.html'">
    <span class="icon">📝</span> تسجيل شركة تأمين جديدة
  </button>
</div>

<script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('./sw.js');
  }
</script>

</body>
</html>
