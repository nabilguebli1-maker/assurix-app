<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - Assurix</title>
  
  <link rel="manifest" href="./manifest.json">
  <meta name="theme-color" content="#004aad">

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f2f2f2;
      display: flex;
      justify-content: center;
      align-items: center;
      height: 100vh;
      margin: 0;
    }

    .box {
      background: white;
      padding: 30px;
      border-radius: 10px;
      width: 90%;
      max-width: 350px;
      box-shadow: 0 0 10px rgba(0,0,0,0.1);
      text-align: center;
    }

    h2 { 
      color: #004aad; 
      margin-bottom: 20px; 
    }

    input, button {
      width: 100%;
      padding: 12px;
      margin-top: 10px;
      border-radius: 5px;
      border: 1px solid #ccc;
      box-sizing: border-box;
      font-size: 16px;
    }

    button {
      background: #004aad;
      color: white;
      border: none;
      cursor: pointer;
      font-weight: bold;
    }

    button:hover { 
      opacity: 0.9; 
    }

    .back-link {
      display: block;
      margin-top: 15px;
      color: #666;
      text-decoration: none;
      font-size: 14px;
    }
  </style>
</head>

<body>

<div class="box">
  <h2>دخول شركة التأمين</h2>

  <input type="email" id="email" placeholder="البريد الإلكتروني">
  <input type="password" id="password" placeholder="كلمة السر">

  <button onclick="login()">دخول</button>
  
  <a href="./home.html" class="back-link">العودة للرئيسية</a>
</div>

<script type="module">
  // استيراد Firebase SDK
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
  import { getAuth, signInWithEmailAndPassword } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

  // إعدادات Firebase الخاصة بمشروعك Assurix
  const firebaseConfig = {
    apiKey: "AIzaSyAQsQ9BU6gcps6XSVgKGKLn7pq_VKeX9Tk",
    authDomain: "assurix-17f53.firebaseapp.com",
    projectId: "assurix-17f53",
    storageBucket: "assurix-17f53.firebasestorage.app",
    messagingSenderId: "793139269214",
    appId: "1:793139269214:web:c0bc20bd1c14a98cb86ecf"
  };

  // تهيئة Firebase
  const app = initializeApp(firebaseConfig);
  const auth = getAuth(app);

  // وظيفة تسجيل الدخول
  window.login = async function() {
    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;

    if (!email || !password) {
      alert("يرجى إدخال البريد الإلكتروني وكلمة السر");
      return;
    }

    try {
      await signInWithEmailAndPassword(auth, email, password);
      alert("تم تسجيل الدخول بنجاح 🎉");
      // التوجيه إلى لوحة التحكم بعد النجاح
      window.location.href = "./dashboard.html";
    } catch (error) {
      alert("فشل الدخول: تأكد من الإيميل وكلمة السر، وتأكد من تفعيل Auth في Firebase");
      console.error("Login Error:", error.message);
    }
  }
</script>

<script>
  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('./sw.js')
      .then(() => console.log("Service Worker Registered"));
  }
</script>

</body>
</html>
